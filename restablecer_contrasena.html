<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="assets/css/style2.css">

    <title>Restablecer contraseña</title>


    <style>

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, .15);
        }


        .card-header {
            background-color: #c62828;
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            padding: 20px;
        }


        .card-body {
            padding: 30px;
        }

    </style>

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand d-flex align-items-center"
               href="index.html">

                <img src="assets/img/logo.png"
                     width="50"
                     height="50"
                     class="me-2">

                AHK-Uruguay

            </a>

        </div>

    </nav>



    <!-- Formulario -->

    <div class="container login-container">

        <div class="card">

            <div class="card-header">

                Nueva contraseña

            </div>


            <div class="card-body">

                <p class="text-center">

                    Ingresá tu nueva contraseña.

                </p>


                <form id="formRestablecer">


                    <!-- Nueva contraseña -->

                    <div class="mb-3">

                        <label class="form-label">

                            Nueva contraseña

                        </label>


                        <input
                            type="password"
                            id="nueva_contrasena"
                            class="form-control"
                            placeholder="Nueva contraseña"
                            minlength="8"
                            required>

                    </div>



                    <!-- Confirmar contraseña -->

                    <div class="mb-4">

                        <label class="form-label">

                            Confirmar contraseña

                        </label>


                        <input
                            type="password"
                            id="confirmar_contrasena"
                            class="form-control"
                            placeholder="Repetí la contraseña"
                            minlength="8"
                            required>

                    </div>



                    <button
                        type="submit"
                        class="btn btn-danger w-100">

                        Cambiar contraseña

                    </button>


                </form>


                <hr>


                <div class="text-center">

                    <a
                        href="login.html"
                        class="btn btn-outline-danger w-100">

                        Volver al inicio de sesión

                    </a>

                </div>


            </div>

        </div>

    </div>


    <footer>

        © 2026 AHK-Uruguay | Todos los derechos reservados.

    </footer>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <script src="js/script_restablecer.js"></script>


</body>

</html>
